[platformio]
default_envs = esp32_nodemcu
src_dir = src
include_dir = include

[env]
framework = arduino
monitor_speed = 115200
build_flags = 
    -Iinclude
    -Wall
    -Wextra

[env:esp32_nodemcu]
platform = espressif32
board = nodemcu-32s
upload_speed = 921600
monitor_filters = esp32_exception_decoder, colorize

[env:esp32_nodemcu_ota]
platform = espressif32
board = nodemcu-32s
upload_protocol = espota
upload_port = 192.168.1.100

[env:stm32_bluepill]
platform = ststm32
board = bluepill_f103c8
upload_protocol = stlink
debug_tool = stlink

[env:stm32_nucleo_f401re]
platform = ststm32
board = nucleo_f401re
upload_protocol = stlink

[env:native]
platform = native
framework = 
build_flags = 
    -std=c++11
    -Iinclude