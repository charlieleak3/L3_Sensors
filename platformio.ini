; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32_nodemcu
src_dir = src
include_dir = include

; ==============================================================================
; SHARED CONFIGURATION
; ==============================================================================
[env]
framework = arduino
monitor_speed = 115200
build_flags = 
    -Iinclude
    -Wall
    -Wextra
lib_deps = 
    ; Add common libraries here (e.g., Adafruit Unified Sensor)

; ==============================================================================
; ESP32 ENVIRONMENTS
; ==============================================================================

; ESP32 NodeMCU-32S (USB Serial Flashing)
[env:esp32_nodemcu]
platform = espressif32
board = nodemcu-32s
upload_speed = 921600
monitor_filters = esp32_exception_decoder, colorize

; ESP32 Over-The-Air (OTA) Flashing
[env:esp32_nodemcu_ota]
platform = espressif32
board = nodemcu-32s
upload_protocol = espota
upload_port = 192.168.1.100  ; Replace with your ESP32's IP address
upload_flags = 
    --auth=admin             ; Optional OTA password

; ==============================================================================
; STM32 ENVIRONMENTS
; ==============================================================================

; STM32F103C8 "Blue Pill" (ST-Link V2)
[env:stm32_bluepill]
platform = ststm32
board = bluepill_f103c8
upload_protocol = stlink
debug_tool = stlink

; STM32 Nucleo-F401RE (Onboard ST-Link)
[env:stm32_nucleo_f401re]
platform = ststm32
board = nucleo_f401re
upload_protocol = stlink

; ==============================================================================
; NATIVE HOST TESTING (Runs unit tests directly on PC)
; ==============================================================================
[env:native]
platform = native
framework = 
build_flags = 
    -std=c++11
    -Iinclude